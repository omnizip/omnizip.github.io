    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <script>
      // GitHub Pages serves public/404.html for unknown deep routes; that page
      // bounces to "/?path=<original>". Restore the real URL before the app
      // module (and the router) initializes.
      (function () {
        var p = new URLSearchParams(window.location.search).get('path')
        if (p && p !== '/') window.history.replaceState(null, '', p)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

    <div id="app"></div>

  </body>
